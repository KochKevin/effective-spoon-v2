name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod


      # Do proper task build later. This is currently just a hack to get the linter working
      - name: Create dummy embed directory for CI
        run: mkdir -p backend/internal/server/dist && touch backend/internal/server/dist/.gitkeep

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          working-directory: ./backend
