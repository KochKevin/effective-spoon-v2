openapi: 3.1.0
info:
  title: KIOSK API
  version: 0.0.3

tags:
  - name: products
  - name: shopping-carts
  - name: users
  - name: auth
  - name: pushes

paths:


  /pushes:
    get:                                
      summary: Subscribe to server sent events
      tags:
        - pushes
      responses:
        '200':
          description: Stream of real time events
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SSEEvent'



  /products:
    get:
      summary: Load all products
      tags:
        - products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'






  /shopping-carts/current:
    post:
      summary: Create a new shopping cart and set it as the current cart
      tags:
        - shopping-carts
      responses:
        '201':
          description: A shopping cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopping-Cart'

    get:
      summary: Get the current shopping cart
      tags:
        - shopping-carts
      responses:
        '200':
          description: A shopping cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopping-Cart'

  /shopping-carts/current/increase:
    post:
      summary: Add product to the current shopping cart
      tags:
        - shopping-carts
      parameters:
        - in: query
          name: productID
          schema:
            type: string
          required: true
          description: Product to add to the current Shopping Cart
      responses:
        '200':
          description: A shopping cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopping-Cart'


  /shopping-carts/current/decrease:
    post:
      summary: Remove product from the current shopping cart
      tags:
        - shopping-carts
      parameters:
        - in: query
          name: productID
          schema:
            type: string
          required: true
          description: Product to remove from the current Shopping Cart
      responses:
        '200':
          description: A shopping cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shopping-Cart'

  /shopping-carts/current/checkout:
    post:
      summary: Check out of the current shopping cart
      tags:
        - shopping-carts
      parameters:
      responses:
        '200':
          description: Successfully checked out of the current shopping cart
          content:
            application/json:
                schema:
                  $ref: '#/components/schemas/Shopping-Cart'




          

  /users/current:
    get:
      summary: Get the currently logged in user
      tags:
        - users
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'






  /auth/usercode:
    post:
      summary: Login with usercode. Only for testing purposes
      tags:
        - auth
      parameters:
        - in: query
          name: usercode
          schema:
            type: string
          required: true
          description: the usercode with which an user can login to the system
      responses:
        '200':
          description: Login successfull

  /auth/logout:
    post:
      summary: Logout current user
      tags:
        - auth
      responses:
        '200':
          description: Logout successfull




  /input/barcode:
    post:
      summary: Use Inputsystem with barcode. Mainly for testing purposes
      tags:
        - input
      parameters:
        - in: query
          name: input
          schema:
            type: string
          required: true
          description: The input which should be inserted with an barcode scanner
      responses:
        '200':
          description: 

  /input/rfid:
    post:
      summary: Use Inputsystem with rfid. Mainly for testing purposes
      tags:
        - input
      parameters:
        - in: query
          name: input
          schema:
            type: string
          required: true
          description: The input which should be inserted from an rfid sensor
      responses:
        '200':
          description:
          

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
      properties:
        id:
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"
        name:
          type: string
          examples: 
            - "Example Product"
        price:
          type: number
          examples: 
            - 1.0

    Shopping-Cart:
      type: object
      required:
        - id
        - fullPrice
        - lineItems
        - userId
        - status
        - transactionId
      properties:
        id:
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"
        fullPrice:
          type: number
          examples: 
            - 10.0
        lineItems: 
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        userId: 
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"
        status:
          type: string
          examples:
            - "active"
            - "checked-out"
        transactionId: 
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"

    LineItem:
      type: object
      required:
        - productId
        - productName
        - amount
        - price
      properties:
        productId:
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"
        productName:
          type: string
          examples: 
            - "Water"
        amount:
          type: integer
          examples: 
            - 5
        price:
          type: number
          examples: 
            - 10.0

    User:
      type: object
      required:
        - userId
        - name
        - balance
        - price
      properties:
        userId:
          type: string
          examples: 
            - "00000000-0000-0000-0000-000000000000"
        name:
          type: string
          examples: 
            - "Max Musterman"
        balance:
          type: number
          examples: 
            - 10.0

    SSEEvent:
      type: string
      enum: [user.login, shoppingcart.update]