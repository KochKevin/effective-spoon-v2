version: "2"

sql:
  - engine: "sqlite"
    schema: "./db/migrations/"
    queries: "./db/queries/"

    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/sqlite/generated/"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "UUID"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"