version: "2"

sql:
  - engine: "sqlite"
    schema: "./internal/infrastructure/db/migrations/"
    queries: "./internal/infrastructure/db/queries/"

    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/sqlite/generated/"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "UUID"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "UUID"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "NullUUID"

          - db_type: "DATETIME"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          